# The quick pull-request gate: targeted UI and client-carry regressions that need no game data.
# The full workspace suite (fmt, clippy, tests) is ci.yml.
name: check
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui
      - name: UI listener ordering and mutation
        run: |
          cargo test -p benilla-ui --lib script::tests::events
          cargo test -p benilla-ui --lib wenilla_listener
  client-carries:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: client-carries
      - name: native Bevy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Compare the small carry against upstream's original math after every merge.
      - name: rig composition equivalence and browser budget
        run: |
          cargo test -p benilla-world --lib rig_anim::compose --no-default-features
          cargo test -p benilla-world --lib web_budget --no-default-features
