# Build, sign, notarize and publish the macOS app when a version tag (v1.2.3) is pushed. The
# release carries the dmg (first install), the zip and appcast.xml (Sparkle updates): installed
# apps read https://github.com/<repo>/releases/latest/download/appcast.xml. See macos/README.md.
name: macOS release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Import the Developer ID certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Write the notary and Sparkle keys
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build, notarize and package (universal)
        env:
          ARCHS: arm64 x86_64
          NOTARY_KEY: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          SPARKLE_KEY_FILE: ${{ runner.temp }}/sparkle.key
        run: VERSION="${TAG#v}" scripts/macos-app.sh --release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Azeroth Survivors ${TAG#v}" --generate-notes
          gh release upload "$TAG" target/macos/dist/* --clobber

      - name: Clean up keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key"
